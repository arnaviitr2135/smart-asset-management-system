services:
  db:
    image: postgres:16-alpine
    container_name: culttrack-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: culttrack
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d culttrack"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: culttrack-backend
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/culttrack?schema=public
      - JWT_SECRET=culttrack-super-secret-key
      - PORT=5000
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Waiting for database connections...' &&
        npx prisma db push --accept-data-loss &&
        npm run prisma:seed &&
        npm run dev
      "
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: culttrack-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: always

volumes:
  pgdata:
